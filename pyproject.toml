[project]
name = "miao-pi"
version = "0.1.0"
requires-python = ">=3.13.7"
dependencies = [
    "fastapi>=0.149.0",
    "langchain>=1.4.7",
    "langchain-openai>=1.0.0",
    "pydantic>=2.14.1",
    "pydantic-settings>=2.16.0",
    "python-json-logger>=4.2.0",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "black>=26.10.1",
    "httpx>=0.28.1",
    "isort>=9.0.2",
    "mypy>=2.4.0",
    "pytest>=9.1.1",
]

[tool.black]
target-version = ["py313"]

[tool.isort]
profile = "black"
py_version = 313

[tool.mypy]
python_version = "3.13"
strict = true
files = ["app", "common", "tests"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
markers = [
    "openai_live: makes a live, paid request to the configured OpenAI API",
    "local_llm_live: makes a live request to the configured local LLM server",
]
